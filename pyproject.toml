[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multiprovider-llm"
version = "0.1.0a1"
description = "Multi-provider LLM client with tier routing, fallback, and budgets"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11,<4"
authors = [{ name = "multiprovider-llm contributors" }]
keywords = ["llm", "openai", "anthropic", "gemini", "fallback", "routing"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.27,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/README.md",
  "/LICENSE",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
  "live: optional live provider smoke tests (excluded from required CI)",
]
testpaths = ["tests"]

[tool.uv]
dev-dependencies = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]
